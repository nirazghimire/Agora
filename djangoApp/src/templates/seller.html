{% extends "home.html" %}

{% block title %}Seller Dashboard{% endblock %}

{% block content %}

<h2>Seller Dashboard</h2>

<div class="card">
    <h4>Add Product</h4>
    <a href="{% url 'create_product' %}"> Click here to add a product</a>
</div>
<div class="card">
    <h4>Currently Selling</h4>
    <ul>
        {% for product in products %}
        <li>{{ product.title }} - {{ product.price }}
            <a href="{% url 'edit_product' product.id %}">Edit</a>
            <a href="{% url 'delete_product' product.id %}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
